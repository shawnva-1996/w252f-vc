<body>
  <div id="app" aria-live="polite"><div class="boot"><img class="boot-logo" src="/img/chc-logo.svg" alt="City Harvest Church" width="112" height="79"><div class="spin"></div></div></div>
  <div id="toast" role="status"></div>
  <script type="module" src="/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      // When a new version arrives, switch to it straight away, except while a set is
      // running on the command centre: there it waits until you leave the set.
      const had = !!navigator.serviceWorker.controller;
      let ready = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!had) return;
        ready = true;
        if (!location.hash.startsWith('#/set/')) location.reload();
      });
      addEventListener('hashchange', () => { if (ready && !location.hash.startsWith('#/set/')) location.reload(); });
    }
  </script>
</body>
